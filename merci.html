<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci ! | Lucide Studio</title>
<meta name="description" content="Votre demande a bien été envoyée à Lucide Studio.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e0b17'/%3E%3Cpath d='M22 14H30V42H46V50H22Z' fill='%23e8b564'/%3E%3Ccircle cx='46' cy='18' r='5' fill='%23e8b564'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0b17; --ink:#f3efe6; --ink-dim:#c4bfd0;
    --line:#2a2440; --amber:#e8b564; --amber-dim:#6b5530;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:28px;position:relative;overflow:hidden;
  }
  body::before{
    content:"";position:absolute;top:-160px;left:50%;transform:translateX(-50%);
    width:600px;height:600px;
    background:radial-gradient(circle, var(--amber-dim) 0%, transparent 70%);
    opacity:0.35;pointer-events:none;
  }
  .box{max-width:520px;position:relative;}
  .check{
    width:64px;height:64px;border-radius:50%;
    background:rgba(232,181,100,0.12);border:1px solid var(--amber);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 26px;font-size:1.6rem;color:var(--amber);
  }
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(1.8rem,4vw,2.4rem);margin-bottom:16px;}
  p{color:var(--ink-dim);font-size:1rem;margin-bottom:32px;}
  .btn{
    display:inline-block;font-size:0.9rem;padding:12px 26px;border-radius:999px;
    background:var(--amber);color:#181121;font-weight:600;
  }
  .logo{
    position:absolute;top:-90px;left:50%;transform:translateX(-50%);
    font-family:'Fraunces',serif;font-weight:600;font-size:1.05rem;
    display:flex;align-items:center;gap:8px;color:var(--ink-dim);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px 2px var(--amber);}
</style>
</head>
<body>
  <div class="box">
    <div class="logo"><span class="dot"></span>Lucide Studio</div>
    <div class="check">✓</div>
    <h1>Message bien reçu</h1>
    <p>Merci pour votre demande. Je reviens vers vous sous 24h avec une proposition adaptée à votre projet.</p>
    <a href="index.html" class="btn">Retour à l'accueil</a>
  </div>
</body>
</html>
